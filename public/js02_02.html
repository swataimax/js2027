<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>js02_02</title>
	<script>
		const x = 2 * (2 + 2); // 2 * 4
		document.write(x, '<br>'); // 4
		let y = 10;
		document.write(y += 10, '<br>'); // y(10) + 10 → 20
		const z = 10;
		document.write(z < 10, '<br>');  // false
		document.write(z <= 10, '<br>'); // true
		document.write('10' === 10, '<br>'); // false
		document.write(10 === 10, '<br>'); // true
		document.write(2 ** 3, '<br>'); // 2 * 2 * 2（2の3乗）
		// true && true → true
		document.write(10 <= 10 && 10 <= 10, '<br>');
		// false && true → false
		document.write(10 < 10 && 10 <= 10, '<br>');
		// false || true → true
		document.write(10 < 10 && 10 <= 10, '<br>'); 
	</script>
</head>

<body>
	<!--    body要素には何も記述しない-->
</body>

</html>
